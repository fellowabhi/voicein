[hotkey]
# Optional toggle shortcut; leave empty "" to disable (tray-only).
shortcut = "Ctrl+Shift+Ins"

[audio]
sample_rate = 16000
# Empty "" = default input device (see `python -m voicein list-devices`)
input_device = ""
# Safety cap seconds; auto-stop then process (0 = unlimited)
max_duration_secs = 300

[stt]
provider = "openai"
model = "gpt-transcribe"
language = "en"

[llm]
provider = "openai"
model = "gpt-4o-mini"
enabled = true
# 0 = format only (no rewriting). 1-10 stronger polish — see README.
rewrite_level = 0

[inject]
method = "clipboard"
auto_paste = true
# GNOME Wayland: ydotool + ydotoold (./scripts/setup-wayland-paste.sh). Uses ydotool type on GNOME (Ctrl+V chords are dropped by Mutter).
wayland_paste = "ydotool"

[feedback]
desktop_notifications = false

[cues]
# Audio feedback for toggle mode (Ctrl+Shift+Ins). Preview: ./scripts/preview-sounds.sh
# Full path to .oga/.wav, or canberra:bell / canberra:complete
start = "/usr/share/sounds/freedesktop/stereo/bell.oga"
stop = "/usr/share/sounds/freedesktop/stereo/complete.oga"
paste = "/usr/share/sounds/freedesktop/stereo/message.oga"

[web]
# Phone recorder. Keep host = 127.0.0.1 (Cloudflare tunnel only).
host = "127.0.0.1"
port = 8765
public_host = "voice.rasdine.com"
